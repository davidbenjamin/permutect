[workspace]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/bioconda"]
name = "permutect"
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.10,<3.14"
htslib = ">=1.19"
libdeflate = ">=1.19"

[feature.cpu.pypi-dependencies]
permutect = { path = ".", editable = true, extras = ["dev"] }
torch = { version = ">=2.10.0,<2.11", index = "https://download.pytorch.org/whl/cpu" }

[feature.gpu]
platforms = ["linux-64"]
system-requirements = { cuda = "13.0" }

[feature.gpu.pypi-dependencies]
permutect = { path = ".", editable = true, extras = ["dev"] }
torch = { version = ">=2.10.0,<2.11", index = "https://download.pytorch.org/whl/cu130" }

[environments]
default = { features = ["cpu"] }
gpu = { features = ["gpu"], solve-group = "gpu" }

[tasks]
test = "pytest permutect/test -x -v"
test-unit = "pytest permutect/test/utils permutect/test/architecture permutect/test/data -x -v"
install-hooks = "ln -sf ../../scripts/pre-commit .git/hooks/pre-commit && echo 'Pre-commit hook installed.'"
